<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking</title>
</head>
<body>
    <h1 align="center">Hotel Room Booking</h1>
    <hr>
<br><br>
<form action="submit_booking.php" method="post">
<label for="Full Name" align="center">Full Name:</label>
<input type="text" id="Full Name" name="Full Name" placeholder="eg.shahnawaz shaikh" required>
<br><br>
<label for="Email" align="center">Email:</label>
<input type="text" id="Email" name="Email" placeholder="eg.shahnawaz shaikh@gmail.com" required>
<br><br>
<label for="number">phone number:</label>
<input type="number" id="phone number" name="phone number" placeholder="eg. 9876543210" required>
<br><br>

<label for="Check-in Date">Check-in Date:</label>
  <input type="date" id="Check-in Date" name="Check-in Date" required>
<br><br>
<label for="Check-out Date">Check-out Date:</label>
<input type="date" id="Check-out Date" name="Check-out Date" required>
<br><br>
<label for room type>Room Type:</label>
<select id="room type" name="room type" required>
    <option value="single room">Single Room</option>
    <option value="double room">Double Room</option>
</select>
<br><br>
<label for="number of guests">Number of Guests :</label>
<input type="number" id="number of guests" name="number of guests" min="1" max="10" required>
<br><br>
<label for="special requests">Special Requests:</label>
<br>
<textarea id="special requests" name="special requests" rows="4" cols="50" placeholder="Enter any special requests or requirements here"></textarea>
<br><br>
<button type="book now">Book Now</button>
<button type="reset form">Reset Form</button> 


</form>
</body>
</html>
